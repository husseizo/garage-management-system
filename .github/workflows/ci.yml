name: CI

on:
  pull_request:
    # feature/** so stacked PRs (e.g. Phase 0.2 onto Phase 0) are checked too.
    branches: [main, develop, "feature/**"]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build/test-only secret. Real secrets live in the hosting platform, never in the repo.
  AUTH_SECRET: ci-only-secret-not-used-in-any-deployment-000000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck · Lint · Unit/Integration · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit and integration tests
        run: npm test
        env:
          # Optional: set repository secret NEON_DEV_DATABASE_URL to run the live Neon check.
          DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
